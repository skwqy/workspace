$kind: http-request
name: actuator/health（三组件聚合状态）
description: status=UP 表示 db / redis / kafka 全部连通；任何一个组件 DOWN 都会反映在这里。
url: "{{baseUrl}}/actuator/health"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('整体状态 UP', () => pm.expect(pm.response.json().status).to.eql('UP'));
    language: text/javascript
order: 1000
