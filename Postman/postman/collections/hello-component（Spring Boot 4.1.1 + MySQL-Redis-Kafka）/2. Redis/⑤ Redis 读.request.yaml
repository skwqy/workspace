$kind: http-request
description: 读取刚写的 key；10 分钟后再读会返回「(null：不存在或已过期)」，可用来观察 TTL。
url: "{{baseUrl}}/api/redis/demo"
method: GET
pathVariables:
  key: demo
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('读到写入的值', () => pm.expect(pm.response.text()).to.eql('hello-redis'));
    language: text/javascript
order: 2000
