$kind: collection
name: hello-component（Spring Boot 4.1.1 + MySQL/Redis/Kafka）
description: |-
  验证 hello-component 全链路：MySQL 落库 → Kafka 收发 → Redis 读写。

  【前置】study-stack 三服务全部 (healthy) + 应用容器已启动（127.0.0.1:8081）。
  【用法】按文件夹顺序执行；点完「① MySQL 保存并发 Kafka」等 2~3 秒再点「③ Kafka 消费回读」。
  【变量】baseUrl 在集合变量里，应用换端口时改这一处即可。
variables:
  baseUrl: http://localhost:8081
