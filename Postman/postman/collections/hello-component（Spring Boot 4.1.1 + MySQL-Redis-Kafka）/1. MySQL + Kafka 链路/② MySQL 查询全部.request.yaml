$kind: http-request
description: 查 hello_message 全部记录，新→旧排列。
url: "{{baseUrl}}/api/messages"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('返回数组', () => pm.expect(Array.isArray(pm.response.json())).to.be.true);
    language: text/javascript
order: 2000
