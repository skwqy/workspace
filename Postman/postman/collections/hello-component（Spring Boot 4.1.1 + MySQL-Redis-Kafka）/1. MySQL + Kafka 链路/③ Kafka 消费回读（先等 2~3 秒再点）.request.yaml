$kind: http-request
description: 消费者收到消息后写进 Redis key kafka:last（TTL 1 天），本接口回读。返回「N:内容」即证明 生产 → 消费 → 落 Redis 全链路通了。
url: "{{baseUrl}}/api/kafka/last"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('已消费到消息（非空占位文案）', () => pm.expect(pm.response.text()).to.not.include('还没消费到任何消息'));
    language: text/javascript
order: 3000
