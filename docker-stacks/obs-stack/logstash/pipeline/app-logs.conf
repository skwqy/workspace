# =====================================================================================
# Logstash —— 日志管道的"加工车间"
#   输入：Kafka app-logs（filebeat 投递）
#   处理：时间字段归一、trace 字段转 ECS 嵌套、错误分级
#   输出：Elasticsearch 按天索引 app-logs-YYYY.MM.dd
# =====================================================================================

input {
  kafka {
    bootstrap_servers => "kafka:9092"
    topics            => ["app-logs"]
    group_id          => "logstash-app-logs"
    client_id         => "logstash-obs"
    codec             => json
    consumer_threads  => 2            # ≈ topic 分区数，别再往上加（多出来的线程会空转）
    auto_offset_reset => "earliest"   # demo 用 earliest，方便回放老日志；生产按需改 latest
    decorate_events   => false        # 不把 kafka 元数据塞进文档
  }
}

filter {
  # ① 应用时间 → @timestamp
  #    应用写的是 log_timestamp，filebeat 的 @timestamp 是"采集时间"。
  #    这一步让 Kibana 的时间轴回到业务真实时间（跨时区、补数据场景尤其重要）。
  date {
    match          => ["log_timestamp", "ISO8601"]
    target         => "@timestamp"
    tag_on_failure => ["_log_timestamp_parse_failure"]
  }

  # ② trace_id / span_id → ECS 风格的 trace.id / span.id
  #    Kibana 里可以直接写 trace.id : "972674aa..." 把一次请求的所有日志串起来
  if [trace_id] and [trace_id] != "" {
    mutate {
      rename => {
        "trace_id" => "[trace][id]"
        "span_id"  => "[span][id]"
      }
    }
  }
  mutate { remove_field => ["trace_flags"] }

  # ③ 日志级别归一（小写），并给 ERROR 打标记，方便做告警与快速筛选
  if [level] {
    mutate { lowercase => ["level"] }
  }
  if [level] == "error" {
    mutate { add_tag => ["error"] }
  }

  # ④ 丢掉 filebeat 的中间态字段
  mutate {
    remove_field => ["@version", "agent", "ecs", "input"]
  }

  # ⑤ 想确认解析结果时打开（会把每条事件打到 logstash 容器标准输出，量大慎用）
  # ruby { code => 'event.set("debug_ok", true)' }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    # 按天索引：demo 够用，Kibana 里用 app-logs-* 通配检索
    # 生产建议改用 data stream + ILM（生命周期自动 rollover/删除），否则索引会无限增长
    index => "app-logs-%{+YYYY.MM.dd}"
  }

  # 调试输出：确认字段结构时取消注释
  # stdout { codec => rubydebug { metadata => false } }
}
